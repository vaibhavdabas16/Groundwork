    right: asset.analytics.products
    join_columns: [{left: product_id, right: product_id}]
    cardinality: many_to_one
    direction: both
    grain_note: safe from item side - item grain is preserved.
    fanout_warning: Many-to-one from items (safe). Reversed (products -> items) it fans out to item grain.
    observed: no orphan product_ids; item-grain sums reconcile exactly after the join.
    owner: team.commerce_analytics
    certification: {status: draft}
    provenance: {authored_by: agent.claude_code, authored_at: 2026-11-19, generated_by: ai}

  - id: join.order_items__sellers
