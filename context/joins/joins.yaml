# Join relationships between serving assets. Cardinality is read left -> right and was checked
# against the real data (see `observed`).
items:
  - id: join.orders__customers
    left: asset.analytics.orders
    right: asset.analytics.customers
    join_columns: [{left: customer_key, right: customer_key}]
    cardinality: one_to_one
    grain_note: customer_key is issued per order, so this is 1:1.
    observed: every customer_key appears in exactly one order (grain.customer_id_one_order = 0).
    owner: team.commerce_analytics
    certification: {status: draft}
    provenance: {authored_by: agent.claude_code, authored_at: 2026-11-19, generated_by: ai}

  - id: join.orders__order_items
    left: asset.analytics.orders
    right: asset.analytics.order_items
    join_columns: [{left: order_id, right: order_id}]
    cardinality: one_to_many
    grain_note: result is at item grain; up to 21 items per order; 775 orders have no items (use LEFT JOIN to keep them).
    fanout_warning: Order-level measures (counts of orders, payments, reviews) are multiplied by the item count. Use count(DISTINCT order_id) or aggregate items first.
    metric_restrictions: [metric.order_count must use count(DISTINCT order_id) after this join, metric.payment_value_total must not be summed after this join]
    bridge: asset.analytics.order_item_totals
    observed: 9,803 orders have more than one item.
    owner: team.commerce_analytics
    certification: {status: draft}
    provenance: {authored_by: agent.claude_code, authored_at: 2026-11-19, generated_by: ai}

  - id: join.orders__order_payments
    left: asset.analytics.orders
    right: asset.analytics.order_payments
    join_columns: [{left: order_id, right: order_id}]
    cardinality: one_to_many
    grain_note: result is at payment-row grain; up to 29 payment rows per order.
    fanout_warning: Order and item measures are multiplied by the number of payment rows. Aggregate payments to order grain first.
    metric_restrictions: [metric.product_sales_value must not be summed after this join]
    bridge: asset.analytics.order_payment_totals
    observed: 2,961 orders have more than one payment row; 1 order has none.
    owner: team.commerce_analytics
    certification: {status: draft}
    provenance: {authored_by: agent.claude_code, authored_at: 2026-11-19, generated_by: ai}

