    cardinality: many_to_one
    grain_note: safe from item side. An order can have several sellers (1,278 orders), so seller attribution is per item.
    fanout_warning: Many-to-one from items (safe). Do not attribute order-level measures (payments, reviews) to a single seller for multi-seller orders.
