    cardinality: one_to_many
    grain_note: result is at review-row grain; 547 orders have multiple reviews, 768 have none.
    fanout_warning: Order, item and payment measures are multiplied for multi-review orders. Use order_review_summary.
    bridge: asset.analytics.order_review_summary
    observed: 547 orders with >1 review row.
    owner: team.customer_experience
    certification: {status: draft}
    provenance: {authored_by: agent.claude_code, authored_at: 2026-11-19, generated_by: ai}

  - id: join.order_items__products
