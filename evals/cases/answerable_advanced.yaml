# Answerable cases: top-N, multi-table joins, governed metrics, payments, customers, sellers,
# delivery, reviews, join-fanout traps, deprecated metric, prompt injection.
cases:
  - id: cf-038
    split: dev
    category: top_n
    difficulty: medium
    question: Which 5 product categories generated the highest product sales value?
    interpretation: >
      Sum of order_items.price per English category name, top 5 by that sum (all order statuses).
    gold_sql: >
      SELECT p.product_category_name_english AS category, sum(i.price) AS sales
      FROM analytics.order_items AS i JOIN analytics.products AS p ON p.product_id = i.product_id
      WHERE p.product_category_name_english IS NOT NULL
      GROUP BY 1 ORDER BY sales DESC LIMIT 5
    alternatives:
      - interpretation: Same ranking reported with the Portuguese source category names.
        gold_sql: >
          SELECT p.product_category_name AS category, sum(i.price) AS sales
          FROM analytics.order_items AS i JOIN analytics.products AS p ON p.product_id = i.product_id
          WHERE p.product_category_name IS NOT NULL
          GROUP BY 1 ORDER BY sales DESC LIMIT 5
    comparator: {type: rows, ordered: false, columns: [category]}
    grain: product category
    refs: {assets: [asset.analytics.order_items, asset.analytics.products], metrics: [metric.product_sales_value]}

  - id: cf-039
    split: heldout
    category: top_n
    difficulty: medium
    question: Which 10 sellers sold the most order items?
    interpretation: seller_id with the highest count of order_items rows, top 10.
    gold_sql: >
      SELECT seller_id, count(*) AS items FROM analytics.order_items
      GROUP BY 1 ORDER BY items DESC LIMIT 10
    comparator: {type: rows, ordered: false, columns: [seller_id]}
    grain: seller
    refs: {assets: [asset.analytics.order_items]}

  - id: cf-040
    split: heldout
    category: top_n
    difficulty: medium
    question: Which 3 customer states placed the most orders?
    interpretation: Orders joined to customers on customer_key, count per customer_state, top 3.
    gold_sql: >
      SELECT c.customer_state, count(*) AS orders
      FROM analytics.orders AS o JOIN analytics.customers AS c ON c.customer_key = o.customer_key
      GROUP BY 1 ORDER BY orders DESC LIMIT 3
    comparator: {type: rows, ordered: false}
    grain: state
    refs: {assets: [asset.analytics.orders, asset.analytics.customers]}

  - id: cf-041
    split: heldout
    category: top_n
    difficulty: medium
    question: Which city has the most distinct customers?
    interpretation: customer_city with the highest count of distinct customer_unique_key.
    gold_sql: >
      SELECT customer_city FROM analytics.customers
      GROUP BY 1 ORDER BY count(DISTINCT customer_unique_key) DESC LIMIT 1
    comparator: {type: rows, ordered: false}
    grain: city
    refs: {assets: [asset.analytics.customers], terms: [term.customer]}

  - id: cf-044
    split: heldout
    category: top_n
    difficulty: hard
    question: In 2017, which purchase month had the highest total payment value?
    interpretation: >
      Sum of payment_value for orders purchased in 2017, grouped by purchase year-month; the top month.
    gold_sql: >
      SELECT strftime(o.order_purchase_timestamp, '%Y-%m') AS month
      FROM analytics.order_payments AS p JOIN analytics.orders AS o ON o.order_id = p.order_id
      WHERE year(o.order_purchase_timestamp) = 2017
      GROUP BY 1 ORDER BY sum(p.payment_value) DESC LIMIT 1
    comparator: {type: rows, ordered: false, month_columns: [month]}
    grain: month
    refs: {assets: [asset.analytics.order_payments, asset.analytics.orders], metrics: [metric.payment_value_total]}

  - id: cf-045
    split: dev
    category: multi_join
    difficulty: medium
    question: What is the total product sales value of orders from customers in Rio de Janeiro state (RJ)?
    interpretation: Sum of item prices for orders whose customer_state is 'RJ' (all statuses, excluding freight).
    gold_sql: >
      SELECT sum(i.price) AS sales
      FROM analytics.order_items AS i
      JOIN analytics.orders AS o ON o.order_id = i.order_id
      JOIN analytics.customers AS c ON c.customer_key = o.customer_key
      WHERE c.customer_state = 'RJ'
    comparator: {type: scalar}
    grain: order item
    refs: {assets: [asset.analytics.order_items, asset.analytics.orders, asset.analytics.customers], metrics: [metric.product_sales_value]}

  - id: cf-046
    split: heldout
    category: multi_join
    difficulty: medium
    question: How many orders contain at least one product from the health_beauty category?
    interpretation: Distinct orders with an item whose product category (Portuguese name beleza_saude / English health_beauty) is health_beauty.
    gold_sql: >
      SELECT count(DISTINCT i.order_id) AS orders
      FROM analytics.order_items AS i JOIN analytics.products AS p ON p.product_id = i.product_id
      WHERE p.product_category_name_english = 'health_beauty'
    comparator: {type: scalar}
    grain: order
    refs: {assets: [asset.analytics.order_items, asset.analytics.products], terms: [term.product_category]}

  - id: cf-048
    split: heldout
    category: multi_join
    difficulty: hard
    question: How many distinct sellers sold items to customers in the state of Amazonas (AM)?
    interpretation: Distinct seller_id over items of orders whose customer_state is 'AM'.
    gold_sql: >
      SELECT count(DISTINCT i.seller_id) AS sellers
      FROM analytics.order_items AS i
      JOIN analytics.orders AS o ON o.order_id = i.order_id
      JOIN analytics.customers AS c ON c.customer_key = o.customer_key
      WHERE c.customer_state = 'AM'
    comparator: {type: scalar}
    grain: seller
    refs: {assets: [asset.analytics.order_items, asset.analytics.orders, asset.analytics.customers]}

  - id: cf-049
    split: heldout
    category: multi_join
    difficulty: hard
    question: How many orders included at least one item shipped by a seller located in a different state from the customer?
    interpretation: Distinct orders having an item where seller_state differs from the order's customer_state.
    gold_sql: >
      SELECT count(DISTINCT i.order_id) AS orders
      FROM analytics.order_items AS i
      JOIN analytics.sellers AS s ON s.seller_id = i.seller_id
      JOIN analytics.orders AS o ON o.order_id = i.order_id
      JOIN analytics.customers AS c ON c.customer_key = o.customer_key
      WHERE s.seller_state <> c.customer_state
    comparator: {type: scalar}
    grain: order
    refs: {assets: [asset.analytics.order_items, asset.analytics.sellers, asset.analytics.orders, asset.analytics.customers]}

  - id: cf-050
    split: heldout
    category: fanout_trap
    difficulty: hard
    question: What is the total payment value of orders that received a 1-star review?
    interpretation: >
      Orders with at least one review scoring 1; sum of all their payments, each payment row counted
      once (joining review rows directly to payment rows would double count orders with several reviews).
    gold_sql: >
      SELECT sum(p.payment_value) AS total_paid
      FROM analytics.order_payments AS p
      WHERE p.order_id IN (SELECT order_id FROM analytics.order_reviews WHERE review_score = 1)
    comparator: {type: scalar}
    grain: payment row
    refs: {assets: [asset.analytics.order_payments, asset.analytics.order_reviews], metrics: [metric.payment_value_total]}

  - id: cf-051
    split: heldout
    category: multi_join
    difficulty: hard
    question: For delivered orders containing furniture_decor products, what is the average delivery time in days?
    interpretation: >
      Delivered orders (with a delivery timestamp) having at least one furniture_decor item; mean of
      purchase-to-delivery time in fractional days, each order counted once.
    gold_sql: >
      SELECT avg(date_diff('second', o.order_purchase_timestamp, o.order_delivered_customer_date)) / 86400.0 AS avg_days
      FROM analytics.orders AS o
      WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
        AND o.order_id IN (
          SELECT i.order_id FROM analytics.order_items AS i
          JOIN analytics.products AS p ON p.product_id = i.product_id
          WHERE p.product_category_name_english = 'furniture_decor')
    comparator: {type: scalar, abs_tolerance: 0.05}
    grain: order
    refs: {assets: [asset.analytics.orders, asset.analytics.order_items, asset.analytics.products], metrics: [metric.average_delivery_days]}

  - id: cf-052
    split: dev
    category: metric_interpretation
    difficulty: hard
    question: What is the repeat customer rate?
    interpretation: Share of distinct customers (customer_unique_key) with 2 or more distinct orders, any status.
    gold_sql: >
      WITH per_customer AS (
        SELECT customer_unique_key, count(DISTINCT order_id) AS orders FROM analytics.orders GROUP BY 1)
      SELECT count(*) FILTER (WHERE orders >= 2) * 1.0 / count(*) AS repeat_customer_rate FROM per_customer
    comparator: {type: scalar, percent_scaling: true, abs_tolerance: 0.0005}
    grain: person
    refs: {assets: [asset.analytics.orders], metrics: [metric.repeat_customer_rate], terms: [term.repeat_customer]}

  - id: cf-053
    split: heldout
    category: metric_interpretation
    difficulty: hard
    question: What is the on-time delivery rate?
    interpretation: >
      Among delivered orders with a delivery timestamp, the share whose delivery DATE is on or before
      the estimated delivery DATE.
    gold_sql: >
      SELECT count(*) FILTER (
               WHERE CAST(order_delivered_customer_date AS DATE) <= CAST(order_estimated_delivery_date AS DATE)
             ) * 1.0 / count(*) AS on_time_rate
      FROM analytics.orders
      WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
    comparator: {type: scalar, percent_scaling: true, abs_tolerance: 0.0005}
    grain: order
    refs: {assets: [asset.analytics.orders], metrics: [metric.on_time_delivery_rate], terms: [term.delivery_delay]}

  - id: cf-054
    split: heldout
    category: metric_interpretation
    difficulty: medium
    question: What is the cancellation rate?
    interpretation: Canceled orders (status 'canceled' only) divided by all orders.
    gold_sql: >
      SELECT count(*) FILTER (WHERE order_status = 'canceled') * 1.0 / count(*) AS cancellation_rate
      FROM analytics.orders
    comparator: {type: scalar, percent_scaling: true, abs_tolerance: 0.00005}
    grain: order
    refs: {assets: [asset.analytics.orders], metrics: [metric.cancellation_rate], terms: [term.canceled_order]}

  - id: cf-055
    split: heldout
    category: delivery
    difficulty: medium
    question: What is the average delivery time in days?
    interpretation: Delivered orders with a delivery timestamp; mean purchase-to-customer-delivery time in fractional days.
    gold_sql: >
      SELECT avg(date_diff('second', order_purchase_timestamp, order_delivered_customer_date)) / 86400.0 AS avg_days
      FROM analytics.orders
      WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
    alternatives:
      - interpretation: Whole calendar-day differences (date_diff('day', ...)) instead of fractional days.
        gold_sql: >
          SELECT avg(date_diff('day', order_purchase_timestamp, order_delivered_customer_date)) AS avg_days
          FROM analytics.orders
          WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
    comparator: {type: scalar, abs_tolerance: 0.05}
    grain: order
    refs: {assets: [asset.analytics.orders], metrics: [metric.average_delivery_days]}

  - id: cf-056
    split: heldout
    category: metric_interpretation
    difficulty: medium
    question: What is the average product value per order, excluding freight?
    interpretation: Mean over orders with at least one item of the order's summed item price.
    gold_sql: SELECT avg(items_price_total) AS avg_order_product_value FROM analytics.order_item_totals
    comparator: {type: scalar}
    grain: order
    refs: {assets: [asset.analytics.order_item_totals], metrics: [metric.average_order_product_value]}

  - id: cf-057
    split: heldout
    category: seller_performance
    difficulty: easy
    question: How many sellers sold at least one item in orders placed in 2018?
    interpretation: Distinct seller_id over items of orders purchased in calendar year 2018 (any status).
    gold_sql: >
      SELECT count(DISTINCT i.seller_id) AS active_sellers
      FROM analytics.order_items AS i JOIN analytics.orders AS o ON o.order_id = i.order_id
      WHERE year(o.order_purchase_timestamp) = 2018
    comparator: {type: scalar}
    grain: seller
    refs: {assets: [asset.analytics.order_items], metrics: [metric.active_seller_count], terms: [term.seller]}

  - id: cf-058
    split: heldout
    category: revenue_payment
    difficulty: hard
    question: What is the total payment value of orders that were paid entirely with vouchers?
    interpretation: Orders whose every payment row has payment_type 'voucher'; sum of their payment_value.
    gold_sql: >
      SELECT sum(payment_value) AS total_paid FROM analytics.order_payments
      WHERE order_id IN (
        SELECT order_id FROM analytics.order_payments GROUP BY order_id
        HAVING bool_and(payment_type = 'voucher'))
    comparator: {type: scalar}
    grain: payment row
    refs: {assets: [asset.analytics.order_payments], terms: [term.voucher]}

  - id: cf-059
    split: heldout
    category: revenue_payment
    difficulty: medium
    question: What share of the total payment value was paid by credit card?
    interpretation: sum(payment_value where credit_card) / sum(payment_value), all rows.
    gold_sql: >
      SELECT sum(payment_value) FILTER (WHERE payment_type = 'credit_card') / sum(payment_value) AS credit_card_share
      FROM analytics.order_payments
    comparator: {type: scalar, percent_scaling: true, abs_tolerance: 0.0005}
    grain: payment row
    refs: {assets: [asset.analytics.order_payments], metrics: [metric.payment_value_total]}

  - id: cf-060
    split: heldout
    category: revenue_payment
    difficulty: medium
    question: What is the total value of items including freight for delivered orders?
    interpretation: Sum of price + freight_value over items of orders with status 'delivered'.
    gold_sql: >
      SELECT sum(i.price + i.freight_value) AS items_gross
      FROM analytics.order_items AS i JOIN analytics.orders AS o ON o.order_id = i.order_id
      WHERE o.order_status = 'delivered'
    comparator: {type: scalar}
    grain: order item
    refs: {assets: [asset.analytics.order_items, asset.analytics.orders], metrics: [metric.items_gross_value]}

  - id: cf-061
    split: dev
    category: revenue_payment
    difficulty: medium
    question: How many orders were paid using more than one payment record?
    interpretation: Orders with more than one order_payments row (split or sequential payments).
    gold_sql: >
      SELECT count(*) AS orders FROM (
        SELECT order_id FROM analytics.order_payments GROUP BY order_id HAVING count(*) > 1) AS t
    comparator: {type: scalar}
    grain: order
    refs: {assets: [asset.analytics.order_payments]}

  - id: cf-062
    split: heldout
    category: revenue_payment
    difficulty: medium
    question: What is the average total payment per order?
    interpretation: Mean over orders with at least one payment row of the order's summed payment_value.
    gold_sql: >
      SELECT avg(total) AS avg_payment_per_order FROM (
        SELECT order_id, sum(payment_value) AS total FROM analytics.order_payments GROUP BY 1) AS t
    comparator: {type: scalar}
    grain: order
    refs: {assets: [asset.analytics.order_payments, asset.analytics.order_payment_totals], metrics: [metric.payment_value_total]}

  - id: cf-063
    split: dev
    category: customer_behavior
    difficulty: medium
    question: How many customers placed more than one order?
    interpretation: Distinct people (customer_unique_key) with 2 or more distinct orders, any status.
    gold_sql: >
      SELECT count(*) AS repeat_customers FROM (
        SELECT customer_unique_key FROM analytics.orders GROUP BY 1 HAVING count(DISTINCT order_id) > 1) AS t
    comparator: {type: scalar}
    grain: person
    refs: {assets: [asset.analytics.orders], terms: [term.repeat_customer, term.customer]}

  - id: cf-065
    split: dev
    category: customer_behavior
    difficulty: hard
    question: What percentage of orders were placed by customers who have ordered more than once?
    interpretation: Orders whose customer_unique_key has 2+ distinct orders, divided by all orders.
    gold_sql: >
      WITH per_customer AS (
        SELECT customer_unique_key, count(DISTINCT order_id) AS n FROM analytics.orders GROUP BY 1)
      SELECT sum(n) FILTER (WHERE n >= 2) * 1.0 / sum(n) AS share_of_orders FROM per_customer
    comparator: {type: scalar, percent_scaling: true, abs_tolerance: 0.0005}
    grain: order
    refs: {assets: [asset.analytics.orders], terms: [term.repeat_customer]}

  - id: cf-066
    split: heldout
    category: customer_behavior
    difficulty: hard
    question: How many customers made their first purchase in 2018?
    interpretation: Distinct customer_unique_key whose earliest order purchase timestamp is in 2018.
    gold_sql: >
      SELECT count(*) AS customers FROM (
        SELECT customer_unique_key FROM analytics.orders GROUP BY 1
        HAVING year(min(order_purchase_timestamp)) = 2018) AS t
    comparator: {type: scalar}
    grain: person
    refs: {assets: [asset.analytics.orders], terms: [term.customer]}

  - id: cf-067
    split: heldout
    category: seller_performance
    difficulty: medium
    question: Which seller generated the highest total product sales value?
    interpretation: seller_id with the largest sum of order_items.price.
    gold_sql: >
      SELECT seller_id FROM analytics.order_items GROUP BY 1 ORDER BY sum(price) DESC LIMIT 1
    comparator: {type: rows, ordered: false}
    grain: seller
    refs: {assets: [asset.analytics.order_items], metrics: [metric.product_sales_value]}

  - id: cf-068
    split: heldout
    category: seller_performance
    difficulty: medium
    question: How many sellers have sold items in more than 10 different orders?
    interpretation: Sellers with count(DISTINCT order_id) > 10 in order_items.
    gold_sql: >
      SELECT count(*) AS sellers FROM (
        SELECT seller_id FROM analytics.order_items GROUP BY 1 HAVING count(DISTINCT order_id) > 10) AS t
    comparator: {type: scalar}
    grain: seller
    refs: {assets: [asset.analytics.order_items]}

  - id: cf-070
    split: heldout
    category: delivery
    difficulty: hard
    question: What share of delivered orders arrived after the estimated delivery date?
    interpretation: >
      Among delivered orders with a delivery timestamp, the share whose delivery DATE is after the
      estimated delivery DATE.
    gold_sql: >
      SELECT count(*) FILTER (
               WHERE CAST(order_delivered_customer_date AS DATE) > CAST(order_estimated_delivery_date AS DATE)
             ) * 1.0 / count(*) AS late_share
      FROM analytics.orders
      WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL
    comparator: {type: scalar, percent_scaling: true, abs_tolerance: 0.0005}
    grain: order
    refs: {assets: [asset.analytics.orders], metrics: [metric.on_time_delivery_rate], terms: [term.delivery_delay]}

  - id: cf-071
    split: heldout
    category: delivery
    difficulty: hard
    question: Which customer state has the longest average delivery time?
    interpretation: >
      Delivered orders with a delivery timestamp, mean purchase-to-delivery days per customer_state; the top state.
    gold_sql: >
      SELECT c.customer_state
      FROM analytics.orders AS o JOIN analytics.customers AS c ON c.customer_key = o.customer_key
      WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
      GROUP BY 1
      ORDER BY avg(date_diff('second', o.order_purchase_timestamp, o.order_delivered_customer_date)) DESC
      LIMIT 1
    comparator: {type: rows, ordered: false}
    grain: state
    refs: {assets: [asset.analytics.orders, asset.analytics.customers], metrics: [metric.average_delivery_days]}

  - id: cf-072
    split: heldout
    category: delivery
    difficulty: medium
    question: How many orders are marked delivered but have no customer delivery date?
    interpretation: order_status = 'delivered' AND order_delivered_customer_date IS NULL.
    gold_sql: >
      SELECT count(*) AS orders FROM analytics.orders
      WHERE order_status = 'delivered' AND order_delivered_customer_date IS NULL
    comparator: {type: scalar}
    grain: order
    refs: {assets: [asset.analytics.orders]}

  - id: cf-074
    split: heldout
    category: reviews
    difficulty: medium
    question: How many orders received at least one 5-star review?
    interpretation: Distinct orders with any review row scoring 5.
    gold_sql: SELECT count(DISTINCT order_id) AS orders FROM analytics.order_reviews WHERE review_score = 5
    comparator: {type: scalar}
    grain: order
    refs: {assets: [asset.analytics.order_reviews], terms: [term.review_score]}

  - id: cf-075
    split: heldout
    category: reviews
    difficulty: medium
    question: What percentage of reviews include a written comment message?
    interpretation: Share of order_reviews rows with has_comment_message = true.
    gold_sql: >
      SELECT avg(CASE WHEN has_comment_message THEN 1.0 ELSE 0.0 END) AS share_with_comment
      FROM analytics.order_reviews
    comparator: {type: scalar, percent_scaling: true, abs_tolerance: 0.0005}
    grain: review row
    refs: {assets: [asset.analytics.order_reviews]}

  - id: cf-076
    split: dev
    category: reviews
    difficulty: easy
    question: How many reviews were given for each review score?
    interpretation: Count of order_reviews rows grouped by review_score (1-5).
    gold_sql: SELECT review_score, count(*) AS reviews FROM analytics.order_reviews GROUP BY 1
    comparator: {type: rows, ordered: false}
    grain: review score
    refs: {assets: [asset.analytics.order_reviews], terms: [term.review_score]}

  - id: cf-077
    split: heldout
    category: reviews
    difficulty: hard
    question: What is the average review score of orders that were delivered after their estimated delivery date?
    interpretation: >
      Delivered orders whose delivery DATE is after the estimated DATE; mean of the order-level mean
      review score (orders without reviews excluded; each order weighted once).
    gold_sql: >
      SELECT avg(r.review_score_mean) AS avg_score
      FROM analytics.order_review_summary AS r JOIN analytics.orders AS o ON o.order_id = r.order_id
      WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
        AND CAST(o.order_delivered_customer_date AS DATE) > CAST(o.order_estimated_delivery_date AS DATE)
    alternatives:
      - interpretation: Mean over review rows of late delivered orders.
        gold_sql: >
          SELECT avg(r.review_score) AS avg_score
          FROM analytics.order_reviews AS r JOIN analytics.orders AS o ON o.order_id = r.order_id
          WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
            AND CAST(o.order_delivered_customer_date AS DATE) > CAST(o.order_estimated_delivery_date AS DATE)
    comparator: {type: scalar, abs_tolerance: 0.01}
    grain: order
    refs: {assets: [asset.analytics.order_review_summary, asset.analytics.orders], metrics: [metric.average_review_score]}

  - id: cf-078
    split: heldout
    category: fanout_trap
    difficulty: hard
    question: What is the total payment value of orders that contain at least 2 items?
    interpretation: Orders with item_count >= 2; sum of their payments, each payment row once (no item x payment fanout).
    gold_sql: >
      SELECT sum(p.payment_value) AS total_paid FROM analytics.order_payments AS p
      WHERE p.order_id IN (SELECT order_id FROM analytics.order_items GROUP BY order_id HAVING count(*) >= 2)
    comparator: {type: scalar}
    grain: payment row
    refs: {assets: [asset.analytics.order_payments, asset.analytics.order_items], metrics: [metric.payment_value_total]}

  - id: cf-079
    split: dev
    category: fanout_trap
    difficulty: hard
    question: What is the total amount paid for orders containing products from the bed_bath_table category?
    interpretation: >
      Orders with at least one bed_bath_table item; sum of their payment rows, each counted once.
      Joining payments to items directly multiplies payments by the number of items.
    gold_sql: >
      SELECT sum(p.payment_value) AS total_paid FROM analytics.order_payments AS p
      WHERE p.order_id IN (
        SELECT i.order_id FROM analytics.order_items AS i
        JOIN analytics.products AS pr ON pr.product_id = i.product_id
        WHERE pr.product_category_name_english = 'bed_bath_table')
    comparator: {type: scalar}
    grain: payment row
    refs: {assets: [asset.analytics.order_payments, asset.analytics.order_items, asset.analytics.products], metrics: [metric.payment_value_total]}

  - id: cf-080
    split: heldout
    category: fanout_trap
    difficulty: hard
    question: What is the average review score of orders containing more than one item?
    interpretation: >
      Orders with item_count > 1 and at least one review; mean of the order-level mean score, each
      order weighted once (joining review rows to item rows would weight orders by item count).
    gold_sql: >
      SELECT avg(r.review_score_mean) AS avg_score
      FROM analytics.order_review_summary AS r
      JOIN analytics.order_item_totals AS t ON t.order_id = r.order_id
      WHERE t.item_count > 1
    comparator: {type: scalar, abs_tolerance: 0.01}
    grain: order
    refs: {assets: [asset.analytics.order_review_summary, asset.analytics.order_item_totals], metrics: [metric.average_review_score]}

  - id: cf-081
    split: heldout
    category: fanout_trap
    difficulty: hard
    question: What is the total freight value of orders that were paid at least partly by credit card?
    interpretation: >
      Orders with any credit_card payment row; sum of their items' freight_value, each item once
      (joining items to payment rows multiplies freight by the number of payment rows).
    gold_sql: >
      SELECT sum(i.freight_value) AS freight_total FROM analytics.order_items AS i
      WHERE i.order_id IN (SELECT order_id FROM analytics.order_payments WHERE payment_type = 'credit_card')
    comparator: {type: scalar}
    grain: order item
    refs: {assets: [asset.analytics.order_items, asset.analytics.order_payments], metrics: [metric.freight_value_total]}

